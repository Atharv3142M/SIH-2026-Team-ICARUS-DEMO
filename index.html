<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Digital Twin — SIH26158</title>
    <style>
        :root {
            --cyan: #00f2ff;
            --dark-cyan: #004d52;
            --bg-dark: #020a0f;
            --bg-panel: rgba(2, 10, 15, 0.85);
            --text-main: #a0d8df;
            --glow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
            z-index: 10;
        }

        .hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Landing Screen */
        #landing-screen { text-align: center; }
        h1 {
            font-size: 2.5rem; color: var(--cyan);
            text-transform: uppercase; letter-spacing: 4px;
            text-shadow: var(--glow); margin-bottom: 2rem;
        }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .btn {
            background: transparent; border: 1px solid var(--cyan);
            color: var(--cyan); padding: 12px 24px;
            cursor: pointer; font-family: inherit;
            text-transform: uppercase; transition: all 0.3s;
            box-shadow: var(--glow);
        }
        .btn:hover { background: var(--cyan); color: var(--bg-dark); }
        .upload-label { cursor: pointer; font-size: 0.9rem; margin-top: 0.5rem; }
        #file-name { color: #666; font-size: 0.8rem; margin-bottom: 1rem; }

        /* Processing Screen */
        #processing-screen { justify-content: flex-start; padding-top: 15%; }
        .terminal {
            width: 80%; max-width: 600px;
            background: var(--bg-panel);
            border: 1px solid var(--dark-cyan);
            padding: 2rem; position: relative;
        }
        .stage {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1rem; opacity: 0.3; transition: opacity 0.3s;
        }
        .stage.active { opacity: 1; color: var(--cyan); }
        .stage.done { opacity: 1; color: #00ff88; }
        .spinner {
            width: 16px; height: 16px; border: 2px solid var(--dark-cyan);
            border-top: 2px solid var(--cyan); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .spinner.done { border-color: #00ff88; border-top-color: #00ff88; animation: none; }
        .checkmark { display: none; color: #00ff88; font-weight: bold; }
        .done .checkmark { display: inline; }
        .done .spinner { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 3D Viewer HUD */
        #viewer-screen { justify-content: flex-end; }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }

        .hud-bracket {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid var(--cyan); z-index: 20;
        }
        .br-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .br-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .br-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .panel {
            background: var(--bg-panel); border: 1px solid var(--dark-cyan);
            color: var(--text-main); padding: 1rem; font-size: 0.8rem;
            box-shadow: var(--glow); z-index: 30;
        }

        #stats-hud {
            position: absolute; top: 20px; right: 20px;
            width: 240px; text-align: left; line-height: 1.6;
        }
        .stat-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--dark-cyan); }

        #controls-panel {
            position: absolute; top: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 0.5rem;
        }

        #jarvis-bar {
            width: 60%; max-width: 800px; margin-bottom: 40px;
            display: flex; gap: 0.5rem;
        }
        #query-input {
            flex: 1; background: var(--bg-panel); border: 1px solid var(--cyan);
            color: var(--cyan); padding: 12px; font-family: inherit;
            outline: none; box-shadow: var(--glow);
        }
        #jarvis-response {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 60%; max-width: 800px; text-align: center;
            font-style: italic; color: var(--cyan); min-height: 1.2em;
            text-shadow: var(--glow);
        }

        #measurement-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2rem; color: var(--cyan); pointer-events: none;
            text-shadow: var(--glow); display: none;
        }

        .legend {
            margin-top: 10px; display: flex; gap: 10px; font-size: 0.7rem;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="hud-bracket br-tl"></div>
    <div class="hud-bracket br-tr"></div>
    <div class="hud-bracket br-bl"></div>
    <div class="hud-bracket br-br"></div>

    <!-- Landing Screen -->
    <div id="landing-screen" class="screen">
        <h1>Spatial Digital Twin<br><span style="font-size: 1.2rem; opacity: 0.7;">Single-Pass UAV Reconstruction</span></h1>
        <div class="btn-group">
            <div>
                <label class="btn upload-label" for="drone-upload">Upload drone flight video</label>
                <input type="file" id="drone-upload" style="display:none">
                <div id="file-name">No file selected</div>
            </div>
            <button id="run-recon" class="btn">Run Reconstruction</button>
        </div>
    </div>

    <!-- Processing Screen -->
    <div id="processing-screen" class="screen hidden">
        <div class="terminal">
            <h2 style="color: var(--cyan); margin-top: 0;">SYSTEM_RECONSTRUCTION_v4.2</h2>
            <div id="stages-container">
                <!-- Stages injected by JS -->
            </div>
        </div>
    </div>

    <!-- Viewer Screen -->
    <div id="viewer-screen" class="screen hidden">
        <div id="canvas-container"></div>

        <div id="stats-hud" class="panel">
            <div style="color: var(--cyan); font-weight: bold; margin-bottom: 5px;">MISSION_STATS</div>
            <div class="stat-row"><span>Proc Time:</span> <span>11m 42s</span></div>
            <div class="stat-row"><span>Target Acc:</span> <span>≤ 1.0 m</span></div>
            <div class="stat-row"><span>Achieved Acc:</span> <span style="color: #00ff88;">0.43 m</span></div>
            <div class="stat-row"><span>Coverage:</span> <span>92%</span></div>
            <div class="stat-row"><span>Points:</span> <span>~2.1M</span></div>
            <div class="stat-row"><span>Faces:</span> <span>~410K</span></div>
        </div>

        <div id="controls-panel" class="panel">
            <button id="toggle-mode" class="btn" style="font-size: 0.7rem;">Mode: Mesh</button>
            <button id="toggle-confidence" class="btn" style="font-size: 0.7rem;">Confidence: Off</button>
            <button id="btn-measure" class="btn" style="font-size: 0.7rem;">Measure: Off</button>
            <button id="btn-measure-height" class="btn" style="font-size: 0.7rem;">Measure Height: Off</button>
            <div id="conf-legend" class="legend hidden">
                <div class="legend-item"><div class="dot" style="background: #00ff88;"></div> High</div>
                <div class="legend-item"><div class="dot" style="background: #ffff00;"></div> Med</div>
                <div class="legend-item"><div class="dot" style="background: #ff0000;"></div> Low</div>
            </div>
        </div>

        <div id="measurement-label">0.00 m</div>

        <div id="jarvis-response"></div>
        <div id="jarvis-bar">
            <input type="text" id="query-input" placeholder="Query JARVIS (e.g. 'highlight buildings above 10m')...">
            <button id="send-query" class="btn">Send</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Global State ---
        const state = {
            currentScreen: 'landing',
            viewMode: 'mesh', // mesh, wireframe, points
            confidenceMode: false,
            measureMode: 'off', // off, distance, height
            measurePoints: [],
            buildings: [],
            scene: null,
            camera: null,
            renderer: null,
            controls: null,
            raycaster: new THREE.Raycaster(),
            mouse: new THREE.Vector2(),
            line: null
        };

        // --- UI Elements ---
        const el = {
            landing: document.getElementById('landing-screen'),
            processing: document.getElementById('processing-screen'),
            viewer: document.getElementById('viewer-screen'),
            upload: document.getElementById('drone-upload'),
            fileName: document.getElementById('file-name'),
            runRecon: document.getElementById('run-recon'),
            stages: document.getElementById('stages-container'),
            toggleMode: document.getElementById('toggle-mode'),
            toggleConf: document.getElementById('toggle-confidence'),
            btnMeasure: document.getElementById('btn-measure'),
            btnHeight: document.getElementById('btn-measure-height'),
            confLegend: document.getElementById('conf-legend'),
            queryInput: document.getElementById('query-input'),
            sendQuery: document.getElementById('send-query'),
            jarvisResponse: document.getElementById('jarvis-response'),
            measLabel: document.getElementById('measurement-label')
        };

        // --- Initialization ---
        el.upload.addEventListener('change', (e) => {
            el.fileName.textContent = e.target.files[0]?.name || 'No file selected';
        });

        el.runRecon.addEventListener('click', startReconstruction);

        async function startReconstruction() {
            switchScreen('processing');
            const stages = [
                "Telemetry Sync (GPS + IMU)",
                "Adaptive Keyframe Selection (18,000 frames → 1,142 keyframes)",
                "Structure-from-Motion (sparse reconstruction)",
                "Dense Multi-View Stereo",
                "Georeferencing (WGS84 → UTM)",
                "Semantic AI Layer (buildings, roads, vegetation)",
                "Digital Twin Assembly"
            ];

            for (let i = 0; i < stages.length; i++) {
                const stageEl = createStageElement(stages[i]);
                el.stages.appendChild(stageEl);

                stageEl.classList.add('active');
                await new Promise(r => setTimeout(r, 1200 + Math.random() * 800));
                stageEl.classList.remove('active');
                stageEl.classList.add('done');
            }

            await new Promise(r => setTimeout(r, 1000));
            init3DViewer();
            switchScreen('viewer');
        }

        function createStageElement(text) {
            const div = document.createElement('div');
            div.className = 'stage';
            div.innerHTML = `<div class="spinner"></div><div class="checkmark">✓</div><span>${text}</span>`;
            return div;
        }

        function switchScreen(id) {
            [el.landing, el.processing, el.viewer].forEach(s => s.classList.add('hidden'));
            if (id === 'landing') el.landing.classList.remove('hidden');
            if (id === 'processing') el.processing.classList.remove('hidden');
            if (id === 'viewer') el.viewer.classList.remove('hidden');
        }

        // --- Three.js Logic ---
        function init3DViewer() {
            try {
                const container = document.getElementById('canvas-container');
                state.scene = new THREE.Scene();
                state.scene.background = new THREE.Color(0x020a0f);
                state.scene.fog = new THREE.FogExp2(0x020a0f, 0.01);

                state.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                state.camera.position.set(40, 30, 40);

                state.renderer = new THREE.WebGLRenderer({ antialias: true });
                state.renderer.setSize(window.innerWidth, window.innerHeight);
                state.renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(state.renderer.domElement);

                state.controls = new OrbitControls(state.camera, state.renderer.domElement);
                state.controls.enableDamping = true;

                // Lights
                const ambientLight = new THREE.AmbientLight(0x404040, 2);
                state.scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0x00f2ff, 1);
                dirLight.position.set(10, 20, 10);
                state.scene.add(dirLight);

                // Ground
                const gridHelper = new THREE.GridHelper(200, 50, 0x004d52, 0x002b2e);
                state.scene.add(gridHelper);

                const planeGeo = new THREE.PlaneGeometry(200, 200);
                const planeMat = new THREE.MeshPhongMaterial({ color: 0x020a0f, transparent: true, opacity: 0.5 });
                const plane = new THREE.Mesh(planeGeo, planeMat);
                plane.rotation.x = -Math.PI / 2;
                state.scene.add(plane);

                // Road
                const roadGeo = new THREE.PlaneGeometry(4, 200);
                const roadMat = new THREE.MeshPhongMaterial({ color: 0x051520 });
                const road = new THREE.Mesh(roadGeo, roadMat);
                road.rotation.x = -Math.PI / 2;
                road.position.y = 0.01;
                state.scene.add(road);

                // Procedural City
                const buildingData = [
                    { x: -10, z: -10, w: 5, d: 5, h: 15, conf: 0.9 },
                    { x: 10, z: -15, w: 8, d: 6, h: 25, conf: 0.8 },
                    { x: -15, z: 10, w: 6, d: 8, h: 10, conf: 0.5 },
                    { x: 15, z: 10, w: 5, d: 12, h: 18, conf: 0.95 },
                    { x: 0, z: -25, w: 10, d: 10, h: 30, conf: 0.7 },
                    { x: 20, z: -5, w: 4, d: 4, h: 8, conf: 0.4 },
                    { x: -20, z: -20, w: 7, d: 7, h: 12, conf: 0.85 },
                    { x: 5, z: 15, w: 6, d: 6, h: 20, conf: 0.6 },
                ];

                buildingData.forEach(data => {
                    const geo = new THREE.BoxGeometry(data.w, data.h, data.d);
                    const mat = new THREE.MeshPhongMaterial({
                        color: 0x00f2ff,
                        transparent: true,
                        opacity: 0.6,
                        shininess: 100
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(data.x, data.h / 2, data.z);

                    // Store meta
                    mesh.userData = { ...data };

                    // Create points representation for "Point Cloud" mode
                    const pointsGeo = new THREE.BufferGeometry().setFromPoints(geo.vertices ? geo.vertices : []);
                    // Modern Three.js: use attributes
                    const vertices = [];
                    const pos = geo.attributes.position;
                    for(let i=0; i<pos.count; i++) {
                        vertices.push(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)));
                    }
                    const pointsMat = new THREE.PointsMaterial({ color: 0x00f2ff, size: 0.2 });
                    const points = new THREE.Points(new THREE.BufferGeometry().setFromPoints(vertices), pointsMat);
                    points.position.copy(mesh.position);
                    points.visible = false;
                    mesh.add(points);
                    mesh.userData.points = points;

                    state.scene.add(mesh);
                    state.buildings.push(mesh);
                });

                // Trees
                for (let i = 0; i < 15; i++) {
                    const x = (Math.random() - 0.5) * 100;
                    const z = (Math.random() - 0.5) * 100;
                    if (Math.abs(x) < 5) continue; // Keep road clear

                    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.2, 2);
                    const trunkMat = new THREE.MeshPhongMaterial({ color: 0x332211 });
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.set(x, 1, z);

                    const leafGeo = new THREE.ConeGeometry(1.5, 4, 6);
                    const leafMat = new THREE.MeshPhongMaterial({ color: 0x006633 });
                    const leaf = new THREE.Mesh(leafGeo, leafMat);
                    leaf.position.set(x, 3.5, z);

                    state.scene.add(trunk);
                    state.scene.add(leaf);
                }

                window.addEventListener('resize', onWindowResize);
                animate();

                // Interaction
                container.addEventListener('click', onSceneClick);
            } catch (e) {
                console.error("3D Init failed:", e);
            }
        }

        function onWindowResize() {
            state.camera.aspect = window.innerWidth / window.innerHeight;
            state.camera.updateProjectionMatrix();
            state.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            state.controls.update();
            state.renderer.render(state.scene, state.camera);
        }

        // --- Interaction Logic ---
        function onSceneClick(event) {
            state.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            state.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            state.raycaster.setFromCamera(state.mouse, state.camera);
            const intersects = state.raycaster.intersectObjects(state.buildings);

            if (state.measureMode === 'distance') {
                const groundIntersect = state.raycaster.intersectObjects(state.scene.children);
                const target = intersects.length > 0 ? intersects[0] : groundIntersect.find(i => i.object.geometry.type === 'PlaneGeometry');

                if (target) {
                    state.measurePoints.push(target.point);
                    if (state.measurePoints.length === 2) {
                        const dist = state.measurePoints[0].distanceTo(state.measurePoints[1]);
                        showMeasurement(dist);
                        drawMeasureLine(state.measurePoints[0], state.measurePoints[1]);
                        state.measurePoints = [];
                    }
                }
            } else if (state.measureMode === 'height') {
                if (intersects.length > 0) {
                    const b = intersects[0].object;
                    const height = b.userData.h;
                    showMeasurement(height + " m (Building Height)");
                }
            }
        }

        function showMeasurement(text) {
            el.measLabel.textContent = typeof text === 'number' ? text.toFixed(2) + " m" : text;
            el.measLabel.style.display = 'block';
            setTimeout(() => { el.measLabel.style.display = 'none'; }, 3000);
        }

        function drawMeasureLine(p1, p2) {
            if (state.line) state.scene.remove(state.line);
            const mat = new THREE.LineBasicMaterial({ color: 0x00f2ff, linewidth: 2 });
            const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            state.line = new THREE.Line(geo, mat);
            state.scene.add(state.line);
            setTimeout(() => { if(state.line) state.scene.remove(state.line); }, 5000);
        }

        // --- Controls ---
        el.toggleMode.addEventListener('click', () => {
            const modes = ['mesh', 'wireframe', 'points'];
            state.viewMode = modes[(modes.indexOf(state.viewMode) + 1) % modes.length];
            el.toggleMode.textContent = `Mode: ${state.viewMode.charAt(0).toUpperCase() + state.viewMode.slice(1)}`;

            state.buildings.forEach(b => {
                b.material.wireframe = (state.viewMode === 'wireframe');
                b.visible = (state.viewMode !== 'points');
                if (b.userData.points) b.userData.points.visible = (state.viewMode === 'points');
            });
        });

        el.toggleConf.addEventListener('click', () => {
            state.confidenceMode = !state.confidenceMode;
            el.toggleConf.textContent = `Confidence: ${state.confidenceMode ? 'On' : 'Off'}`;
            el.confLegend.classList.toggle('hidden', !state.confidenceMode);

            state.buildings.forEach(b => {
                if (state.confidenceMode) {
                    const conf = b.userData.conf;
                    if (conf > 0.8) b.material.color.set(0x00ff88);
                    else if (conf > 0.6) b.material.color.set(0xffff00);
                    else b.material.color.set(0xff0000);
                } else {
                    b.material.color.set(0x00f2ff);
                }
            });
        });

        el.btnMeasure.addEventListener('click', () => {
            state.measureMode = state.measureMode === 'distance' ? 'off' : 'distance';
            el.btnMeasure.textContent = `Measure: ${state.measureMode === 'distance' ? 'ON' : 'Off'}`;
            el.btnHeight.classList.add('hidden'); // Hide height btn if distance is on
            if (state.measureMode === 'distance') el.btnHeight.classList.add('hidden');
        });

        el.btnHeight.addEventListener('click', () => {
            state.measureMode = state.measureMode === 'height' ? 'off' : 'height';
            el.btnHeight.textContent = `Measure Height: ${state.measureMode === 'height' ? 'ON' : 'Off'}`;
            if (state.measureMode === 'height') el.btnMeasure.classList.add('hidden');
        });

        // --- JARVIS Queries ---
        async function typeWriter(text) {
            el.jarvisResponse.textContent = "";
            for (let i = 0; i < text.length; i++) {
                el.jarvisResponse.textContent += text[i];
                await new Promise(r => setTimeout(r, 30));
            }
        }

        async function handleQuery() {
            const query = el.queryInput.value.toLowerCase();
            el.queryInput.value = "";

            if (query.includes("highlight buildings above 10")) {
                let count = 0;
                state.buildings.forEach(b => {
                    if (b.userData.h > 10) {
                        b.material.emissive = new THREE.Color(0x00f2ff);
                        b.material.emissiveIntensity = 1;
                        count++;
                    } else {
                        b.material.emissive = new THREE.Color(0x000000);
                    }
                });
                await typeWriter(`Found ${count} structures exceeding 10 meters. Highlighting now.`);
                setTimeout(() => {
                    state.buildings.forEach(b => b.material.emissiveIntensity = 0);
                }, 5000);

            } else if (query.includes("tallest building")) {
                let tallest = state.buildings[0];
                state.buildings.forEach(b => { if(b.userData.h > tallest.userData.h) tallest = b; });
                await typeWriter(`The tallest structure is ${tallest.userData.h} meters.`);

                // Visual feedback
                tallest.material.color.set(0xffffff);
                setTimeout(() => {
                    if(!state.confidenceMode) tallest.material.color.set(0x00f2ff);
                }, 2000);

            } else if (query.includes("accuracy") || query.includes("accurate")) {
                await typeWriter(`Spatial analysis complete: RMSE 0.43m, Completeness 92%, Confidence High.`);
            } else {
                await typeWriter(`I didn't recognize that command. Try: 'highlight buildings above 10 meters' or 'how accurate is this'.`);
            }
        }

        el.sendQuery.addEventListener('click', handleQuery);
        el.queryInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleQuery(); });

    </script>
</body>
</html>
